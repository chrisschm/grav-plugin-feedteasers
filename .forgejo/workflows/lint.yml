name: Syntax Checks

on:
  push:
   branches:
      - develop
  pull_request:
    branches:
      - main
      - develop
    # Deliberately lists only main/develop: PRs targeting the "translate"
    # branch (Codeberg Translate, see the translation setup in the README)
    # therefore don't trigger this job. Only languages/*.yaml ever changes
    # there, never PHP/JS/Twig - the lint job wouldn't check anything there,
    # but would waste runner minutes.

jobs:
  syntax-php-js-twig:
    if: github.server_url != 'https://github.com'
    runs-on: codeberg-small
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: https://github.com/shivammathur/setup-php@v2 # Explicitly request the image from GitHub
        with:
          php-version: '8.3' # Choose desired version
          tools: composer:v2
          coverage: none # Optional: skip the code-coverage driver to save time

      - name: Show PHP and Composer versions
        run: |
          php -v
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Determine changed files
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          git diff --name-only --diff-filter=d "$BASE" HEAD > changed.txt || true
          cat changed.txt

      - name: Check PHP syntax
        run: |
          # Check whether PHP files are in the list
          PHP_FILES=$(grep -E '\.php$' changed.txt || true)
          if [ -z "$PHP_FILES" ]; then
            echo "No PHP files changed. Skipping syntax check."
            exit 0
          fi
          echo "$PHP_FILES" | xargs -r -n1 php -l

      - name: Check JS syntax
        run: |
          # Check whether JS files are in the list
          JS_FILES=$(grep -E '\.js$' changed.txt || true)
          if [ -z "$JS_FILES" ]; then
            echo "No JS files changed. Skipping syntax check."
            exit 0
          fi
          echo "$JS_FILES" | xargs -r -n1 node --check

      - name: Check Twig syntax
        run: |
          TWIG_FILES=$(grep -E '\.twig$' changed.txt || true)
          if [ -z "$TWIG_FILES" ]; then
            echo "No Twig files changed."
            exit 0
          fi

          mkdir -p /tmp/twig-lint
          composer require --working-dir=/tmp/twig-lint twig/twig --no-interaction --quiet

          echo "$TWIG_FILES" | while read -r f; do
            [ -f "$f" ] || continue
            php -r '
              require "/tmp/twig-lint/vendor/autoload.php";
              $file = $argv[1];
              $loader = new \Twig\Loader\ArrayLoader([]);
              $twig = new \Twig\Environment($loader);

              // Grav and plugins register their own Twig functions/filters
              // (e.g. url(), nicetime(), t() ...), which are naturally
              // unknown in this isolated lint environment. Without these
              // fallbacks, any use of such a function would be wrongly
              // reported as an error even though the Twig syntax is
              // correct. The fallbacks accept any name without executing
              // it - pure syntax checking, no real execution.
              $twig->registerUndefinedFunctionCallback(function ($name) {
                  return new \Twig\TwigFunction($name, function () {});
              });
              $twig->registerUndefinedFilterCallback(function ($name) {
                  return new \Twig\TwigFilter($name, function ($v) { return $v; });
              });

              try {
                  $twig->parse($twig->tokenize(new \Twig\Source(file_get_contents($file), $file)));
                  echo "$file: OK\n";
              } catch (\Twig\Error\SyntaxError $e) {
                  fwrite(STDERR, "$file: " . $e->getMessage() . "\n");
                  exit(1);
              }
            ' "$f"
          done
