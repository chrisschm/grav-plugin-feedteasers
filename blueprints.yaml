name: Feed Teasers
slug: feedteasers
type: plugin
version: 1.0.5
description: Zeigt Beitrags-Teaser aus externen RSS/Atom-Feeds als klickbare Kacheln an.
dependencies:
  - { name: grav, version: '>=1.7.0' }
icon: rss
author:
    name: Christian Schmidt
    email: chschmidt@noreply.codeberg.org
    url: https://www.jcs-net.de
homepage: https://codeberg.org/chschmidt/grav-plugin-feedteasers
keywords: grav, plugin, rss, atom, feed, teaser
bugs: https://codeberg.org/chschmidt/grav-plugin-feedteasers/issues
docs: https://codeberg.org/chschmidt/grav-plugin-feedteasers/wiki
license: MIT
compatibility:
  grav:
    - '1.7'
    - '2.0'

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_FEEDTEASERS.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool

    tabs:
      type: tabs
      fields:

        general:
          type: tab
          title: PLUGIN_FEEDTEASERS.TAB_GENERAL
          fields:
            cache_time:
              type: number
              label: PLUGIN_FEEDTEASERS.CACHE_TIME
              validate:
                min: 60
                required: true

            items_per_feed:
              type: number
              label: PLUGIN_FEEDTEASERS.ITEMS_PER_FEED
              validate:
                min: 1
                max: 30
                required: true

            teaser_length:
              type: number
              label: PLUGIN_FEEDTEASERS.TEASER_LENGTH
              validate:
                min: 40
                max: 600
                required: true

            card_min_width:
              type: text
              label: PLUGIN_FEEDTEASERS.CARD_MIN_WIDTH
              help: PLUGIN_FEEDTEASERS.CARD_MIN_WIDTH_HELP
              default: '260px'
              validate:
                required: true

            request_timeout:
              type: number
              label: PLUGIN_FEEDTEASERS.REQUEST_TIMEOUT
              validate:
                min: 2
                max: 30
                required: true

            show_tabs:
              type: toggle
              label: PLUGIN_FEEDTEASERS.SHOW_TABS
              default: 1
              options:
                1: PLUGIN_ADMIN.YES
                0: PLUGIN_ADMIN.NO
              validate:
                type: bool

            image_fallback:
              type: text
              label: PLUGIN_FEEDTEASERS.IMAGE_FALLBACK
              help: PLUGIN_FEEDTEASERS.IMAGE_FALLBACK_HELP

        feeds:
          type: tab
          title: PLUGIN_FEEDTEASERS.TAB_FEEDS
          fields:
            feeds:
              type: list
              label: PLUGIN_FEEDTEASERS.FEEDS
              collapsed: true
              style: vertical
              fields:
                .name:
                  type: text
                  label: PLUGIN_FEEDTEASERS.FEED_NAME
                  validate:
                    required: true
                .url:
                  type: text
                  label: PLUGIN_FEEDTEASERS.FEED_URL
                  validate:
                    required: true
