    REQUEST_TIMEOUT: 'HTTP-Timeout (Sekunden)'
    SSRF_ALLOWED_HOSTS_HINT: |
        Aus Sicherheitsgründen (SSRF-Schutz) lehnt das Plugin standardmäßig Anfragen an
        private/lokale/interne Adressen beim Feed-Abruf ab (z. B. 127.0.0.1, 10.0.0.0/8,
        169.254.169.254, ::1) - auch wenn ein Feed per HTTP-Redirect dorthin verweist.
        Wer bewusst einen internen Feed einbinden möchte, kann ihn explizit freigeben,
        direkt in `user/config/plugins/feedteasers.yaml`:
        ```yaml
        ssrf_allowed_hosts:
          - 'feed.internal.example'
        ```
        **Achtung:** Jeder hier eingetragene Host wird für den Server erreichbar gemacht,
        auch wenn er in einem internen Netz liegt - nur eintragen, wem man vertraut.
    SHOW_TABS: 'Tabs anzeigen (bei mehreren Feeds)'
    IMAGE_FALLBACK: 'Fallback-Teaserbild'
    IMAGE_FALLBACK_HELP: 'Pfad, absolute URL oder Grav-Stream (z.B. plugin://feedteasers/images/fallback.png, theme://images/eigenes-bild.jpg). Leer lassen für kein Fallback-Bild.'
    FEEDS: 'Feeds'
