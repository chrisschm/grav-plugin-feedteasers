enabled: true

# Wie lange (in Sekunden) ein abgerufener Feed zwischengespeichert wird,
# bevor er erneut abgerufen wird.
cache_time: 1800

# Maximale Anzahl an Beiträgen pro Feed.
items_per_feed: 6

# Länge des Textanrisses (Anzahl Zeichen) je Teaser.
teaser_length: 180

# Mindestbreite einer einzelnen Teaser-Kachel (CSS-Wert, z.B. '260px' oder '18rem').
# Bestimmt indirekt, wie viele Kacheln nebeneinander passen, bevor umgebrochen wird.
card_min_width: '260px'

# Reiter (Tabs) anzeigen, wenn mehr als ein Feed konfiguriert ist.
show_tabs: true

# Fallback-Bild, falls ein Feed-Eintrag kein Teaserbild liefert.
# Akzeptiert einen klassischen Pfad (z.B. '/images/eigenes-bild.jpg'), eine
# absolute URL (https://...) oder einen Grav-Stream (plugin://, theme://, user://).
# Standardmäßig wird das mitgelieferte generische Platzhalterbild verwendet.
# Leer lassen, um ganz auf ein Fallback-Bild zu verzichten.
image_fallback: 'plugin://feedteasers/images/fallback.png'

# HTTP-Timeout in Sekunden beim Abruf eines Feeds.
request_timeout: 8

# SSRF-Schutz: Jede tatsaechlich kontaktierte Adresse (inkl. jedes
# HTTP-Redirect-Ziels) wird vor dem Abruf geprueft und private/lokale
# Adressen (Loopback, RFC1918, Link-Local/Cloud-Metadaten, ...) werden
# grundsaetzlich blockiert. Diese Liste ist nur fuer den seltenen Fall
# gedacht, dass ein Feed absichtlich auf einer solchen Adresse liegt
# (z.B. ein selbst gehosteter Feed im internen Netz) - Hostnamen oder
# IP-Adressen eintragen, die trotzdem erlaubt sein sollen. Normalerweise
# leer lassen. Kein Admin-Panel-Feld, nur ueber diese Datei konfigurierbar.
ssrf_allowed_hosts: []

# Liste der einzubindenden Feeds. Kann im Admin-Panel bearbeitet werden.
feeds:
    -
        name: 'Beispiel Feed'
        url: 'https://example.com/feed.xml'
