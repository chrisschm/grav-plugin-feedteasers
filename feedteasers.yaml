enabled: true

# How long (in seconds) a fetched feed is cached before it is fetched
# again.
cache_time: 1800

# Maximum number of items per feed.
items_per_feed: 6

# Length of the teaser excerpt (number of characters) per teaser.
teaser_length: 180

# Minimum width of a single teaser card (CSS value, e.g. '260px' or '18rem').
# Indirectly determines how many cards fit side by side before wrapping.
card_min_width: '260px'

# Show tabs when more than one feed is configured.
show_tabs: true

# Fallback image used when a feed item doesn't provide a teaser image.
# Accepts a classic path (e.g. '/images/my-own-image.jpg'), an absolute
# URL (https://...) or a Grav stream (plugin://, theme://, user://).
# The bundled generic placeholder image is used by default.
# Leave empty to disable the fallback image entirely.
image_fallback: 'plugin://feedteasers/images/fallback.png'

# HTTP timeout in seconds when fetching a feed.
request_timeout: 8

# SSRF protection: every address actually contacted (including every
# HTTP redirect target) is checked before the request, and private/local
# addresses (loopback, RFC1918, link-local/cloud metadata, ...) are
# blocked by default. This list is only meant for the rare case where a
# feed deliberately lives at such an address (e.g. a self-hosted feed on
# the internal network) - enter hostnames or IP addresses that should be
# allowed anyway. Normally leave this empty. Not an admin panel field,
# only configurable via this file.
ssrf_allowed_hosts: []

# List of feeds to include. Can be edited in the admin panel.
feeds:
    -
        name: 'Example Feed'
        url: 'https://example.com/feed.xml'
